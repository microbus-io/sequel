# https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-go

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# The suite picks its database from the SEQUEL_TESTING_DSN environment variable. An unset/empty value runs
# against in-memory SQLite; otherwise sequel.CreateTestingDatabase connects to the server and provisions an
# isolated, auto-dropped testing database per test off this base DSN (which therefore needs CREATE/DROP
# DATABASE privilege). Each job below points SEQUEL_TESTING_DSN at one provider so the same tests run against
# every supported server. Credentials are throwaway CI service-container values, not secrets.

jobs:
  sqlite:
    name: SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test (SQLite in-memory)
        run: go test -race ./... -count=1 -timeout 20m

  mysql:
    name: MySQL
    runs-on: ubuntu-latest
    # The driver's own DSN format, which every MySQL user has. The mysql:// prefix only adds a strip before the same
    # path, which the unit tests and the MariaDB job's mariadb:// run cover.
    services:
      mysql:
        image: mysql:9.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SEQUEL_TESTING_DSN: root:root@tcp(127.0.0.1:3306)/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test (MySQL)
        run: go test -race ./... -count=1 -timeout 20m

  mariadb:
    name: MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SEQUEL_TESTING_DSN: mariadb://root:root@tcp(127.0.0.1:3306)/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test (MariaDB)
        run: go test -race ./... -count=1 -timeout 20m

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SEQUEL_TESTING_DSN: postgres://postgres:postgres@127.0.0.1:5432/?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test (PostgreSQL)
        run: go test -race ./... -count=1 -timeout 20m

  sqlserver:
    name: SQL Server
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Sequel_CI_Pass_2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Sequel_CI_Pass_2026 -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      SEQUEL_TESTING_DSN: sqlserver://sa:Sequel_CI_Pass_2026@127.0.0.1:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test (SQL Server)
        run: go test -race ./... -count=1 -timeout 20m
      # Skipped above: go-mssqldb races on a discarded connection's read buffer, which the race detector reports
      - name: Test cancelled transactions (SQL Server, no race detector)
        run: go test ./fixtures -run TestTransact_EndedContextLeavesThePoolUsable -count=1 -timeout 20m

  cockroachdb:
    name: CockroachDB
    runs-on: ubuntu-latest
    # A service container cannot be given a command, and CockroachDB needs one, so it is started in a step. It
    # listens on 26300, not its default port, so that only the cockroachdb:// scheme can identify it.
    env:
      SEQUEL_TESTING_DSN: cockroachdb://root@127.0.0.1:26300/?sslmode=disable
    steps:
      - name: Start CockroachDB
        run: |
          docker run -d --name cockroachdb -p 26300:26257 cockroachdb/cockroach:latest-v26.3 start-single-node --insecure
          for i in $(seq 1 30); do
            docker exec cockroachdb ./cockroach sql --insecure -e 'SELECT 1' && exit 0
            sleep 2
          done
          docker logs cockroachdb
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test (CockroachDB)
        run: go test -race ./... -count=1 -timeout 20m
